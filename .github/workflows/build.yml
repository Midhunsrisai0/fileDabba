name: Manual Build, Push & Release

on:
  workflow_dispatch: # Enables the "Run workflow" button

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Echo - Checkout Complete
        run: echo "✓ Code checkout completed"

      - name: Get Short SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo_owner_lowercase=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Echo - Variables Set
        run: |
          echo "✓ Short SHA: ${{ steps.vars.outputs.sha_short }}"
          echo "✓ Repository owner (lowercase): ${{ steps.vars.outputs.repo_owner_lowercase }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Echo - GHCR Login Complete
        run: echo "✓ Logged in to GitHub Container Registry"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Echo - Buildx Setup Complete
        run: echo "✓ Docker Buildx configured"

      # 1. Build and Push to Registry
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_owner_lowercase }}/filedabba-backend:latest
            ghcr.io/${{ steps.vars.outputs.repo_owner_lowercase }}/filedabba-backend:${{ steps.vars.outputs.sha_short }}

      - name: Echo - Build and Push Complete
        run: |
          echo "✓ Docker image built and pushed successfully"
          echo "  - ghcr.io/${{ steps.vars.outputs.repo_owner_lowercase }}/filedabba-backend:latest"
          echo "  - ghcr.io/${{ steps.vars.outputs.repo_owner_lowercase }}/filedabba-backend:${{ steps.vars.outputs.sha_short }}"

      # 2. Export to a local .tar file
      - name: Export to Tar
        run: |
          docker pull ghcr.io/${{ steps.vars.outputs.repo_owner_lowercase }}/filedabba-backend:${{ steps.vars.outputs.sha_short }}
          docker save ghcr.io/${{ steps.vars.outputs.repo_owner_lowercase }}/filedabba-backend:${{ steps.vars.outputs.sha_short }} \
          > filedabba-backend-${{ steps.vars.outputs.sha_short }}.tar

      - name: Echo - Export Complete
        run: |
          echo "✓ Docker image exported to tar file"
          echo "  File: filedabba-backend-${{ steps.vars.outputs.sha_short }}.tar"

      # 3. Create the GitHub Release with the .tar attached
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the commit SHA as the tag name for the release
          tag_name: release-${{ steps.vars.outputs.sha_short }}
          name: Manual Release ${{ steps.vars.outputs.sha_short }}
          files: filedabba-backend-${{ steps.vars.outputs.sha_short }}.tar
          body: |
            ## Manual Deployment Info
            - **Registry Image:** `ghcr.io/${{ steps.vars.outputs.repo_owner_lowercase }}/filedabba-backend:${{ steps.vars.outputs.sha_short }}`
            - **Status:** Built and uploaded manually via GitHub Actions.

      - name: Echo - Release Complete
        run: |
          echo "✓ GitHub Release created successfully"
          echo "  Tag: release-${{ steps.vars.outputs.sha_short }}"
          echo "  Release Name: Manual Release ${{ steps.vars.outputs.sha_short }}"
          echo "🎉 Workflow completed successfully!"
