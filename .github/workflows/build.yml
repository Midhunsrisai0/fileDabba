name: Manual Build, Push & Release

on:
  workflow_dispatch: # Enables the "Run workflow" button

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and Push to Registry
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/filedabba-backend:latest
            ghcr.io/${{ github.repository_owner }}/filedabba-backend:${{ steps.vars.outputs.sha_short }}

      # 2. Export to a local .tar file
      - name: Export to Tar
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/filedabba-backend:${{ steps.vars.outputs.sha_short }}
          docker save ghcr.io/${{ github.repository_owner }}/filedabba-backend:${{ steps.vars.outputs.sha_short }} \
          > filedabba-backend-${{ steps.vars.outputs.sha_short }}.tar

      # 3. Create the GitHub Release with the .tar attached
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the commit SHA as the tag name for the release
          tag_name: release-${{ steps.vars.outputs.sha_short }}
          name: Manual Release ${{ steps.vars.outputs.sha_short }}
          files: filedabba-backend-${{ steps.vars.outputs.sha_short }}.tar
          body: |
            ## Manual Deployment Info
            - **Registry Image:** `ghcr.io/${{ github.repository_owner }}/filedabba-backend:${{ steps.vars.outputs.sha_short }}`
            - **Status:** Built and uploaded manually via GitHub Actions.
