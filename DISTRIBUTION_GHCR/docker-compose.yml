version: "3.9"

services:
  app:
    image: ghcr.io/midhunsrisai0/filedabba-backend:latest
    ports:
      - "0.0.0.0:1729:1729"
      - "0.0.0.0:5555:5555"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: midhun1234
      POSTGRES_DB: fileDabba
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --requirepass kKBmHOG

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "0.0.0.0:5540:5540"
    depends_on:
      - redis

volumes:
  postgres_data:
  uploads_data:
  backups_data:
